dataset:
  schema_version: unsw_nb15_raw_49_v1
  raw_directory: data/raw
  expected_raw_columns: 49
  test_size: 0.20
  split_seed: 42

cv:
  folds: 5
  shuffle: true
  seed: 42

feature_processing:
  strategy: sequential_mi_pca
  mi_k: 15
  mi_random_state: 42
  mi_n_neighbors: 3
  pca_variance: 0.95
  pca_svd_solver: auto

balancing:
  method: kmeans
  random_state: 42
  rus_cap: 15000
  n_clusters: 20
  k_neighbors: 3
  cluster_balance_threshold: 0.0
  n_jobs: 1

evaluation:
  primary_selection_metric: macro_f1
  normal_class: Normal

models:
  hgb:
    max_iter: 30
    learning_rate: 0.05
    max_depth: 5
    l2_regularization: 1.0
    random_state: 42
  xgboost:
    n_estimators: 30
    subsample: 0.1
    max_depth: 3
    min_child_weight: 20
    gamma: 0.2
    learning_rate: 0.05
    colsample_bytree: 0.1
    reg_alpha: 0.5
    use_label_encoder: false
    eval_metric: mlogloss
    tree_method: hist
    random_state: 42
    verbosity: 0
  logistic:
    solver: saga
    max_iter: 50
    random_state: 42
    n_jobs: -1
